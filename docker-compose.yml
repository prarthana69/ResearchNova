version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./researchnova.db
      - IBM_WATSONX_API_KEY=${IBM_WATSONX_API_KEY:-}
      - IBM_WATSONX_PROJECT_ID=${IBM_WATSONX_PROJECT_ID:-}
      - IBM_WATSONX_URL=${IBM_WATSONX_URL:-https://us-south.ml.cloud.ibm.com}
      - IBM_WATSONX_MODEL_ID=${IBM_WATSONX_MODEL_ID:-ibm/granite-13b-chat-v2}
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000
    working_dir: /app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  backend_uploads:
